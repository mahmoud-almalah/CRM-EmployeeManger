title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Anything that is already planned is on the [project board](https://github.com/users/mahmoud-almalah/projects/5); check it first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is hard, missing or unclear today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? An example request and response helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
