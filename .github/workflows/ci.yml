name: CI

on:
  pull_request:
    branches: [develop, staging, master]
  push:
    branches: [develop, staging, master]
  schedule:
    # Weekly, so a newly published advisory shows up even when nobody pushes.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, static analysis, tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Pest
        run: vendor/bin/pest

  mysql:
    name: Tests on MySQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: employee_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: employee_manager_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Pest on MySQL
        run: vendor/bin/pest

  docker:
    name: Docker stack
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --target production --tag employee-manager:ci .

      - name: Production image has no dev dependencies
        run: docker run --rm --entrypoint sh employee-manager:ci -c 'test -d vendor/laravel/framework && ! test -d vendor/pestphp/pest'

      - name: Start the development stack
        env:
          COMPOSE_BAKE: "false"
        run: |
          export USER_ID=$(id -u) GROUP_ID=$(id -g)
          docker compose up --build --detach --wait --wait-timeout 300

      - name: Health check answers
        run: curl --fail --silent --show-error http://localhost:8080/api/health

      - name: The demo admin can sign in
        run: |
          curl --fail --silent --show-error -X POST http://localhost:8080/api/auth/login \
            -H 'Accept: application/json' \
            -d 'login=admin' -d 'password=password' | grep -q '"token"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Audit locked dependencies
        run: composer audit --locked
