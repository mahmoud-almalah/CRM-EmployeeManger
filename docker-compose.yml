# Local development stack: the API on http://localhost:8080 and MySQL.
#   docker compose up --build
# The source is mounted, so edits show up without rebuilding. Demo data is
# loaded with an admin account (admin / password): this file is for development only.

services:
  app:
    build:
      context: .
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Employee Manager API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: employee_manager
      DB_USERNAME: employee
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      INSTALL_DEMO_DATA: "true"
      PHP_OPCACHE_ENABLE: "0"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-secret
      MYSQL_DATABASE: employee_manager
      MYSQL_USER: employee
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
